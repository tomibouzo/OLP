<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trip Draft</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#eef0e8;--card:#fbfbf7;--ink:#1d2a22;--mut:#66756b;--line:#d3d9cc;--pine:#1f5c3f;--pineink:#fff;--sun:#e8a33d;--bad:#a8402c}
@media(prefers-color-scheme:dark){:root{--bg:#141b17;--card:#1c2620;--ink:#e8eee6;--mut:#9aab9f;--line:#32423a;--pine:#5fb386;--pineink:#0e1812;--sun:#e8a33d;--bad:#e5846f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Avenir Next",Avenir,"Segoe UI",system-ui,sans-serif}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:14px 20px;background:var(--pine);color:var(--pineink)}
h1{margin:0;font:700 22px Georgia,"Times New Roman",serif;letter-spacing:.2px}
h2{margin:0 0 10px;font:700 17px Georgia,serif}
h2 small{font:400 13px system-ui,sans-serif;color:var(--mut);margin-left:6px}
.bar{display:flex;flex-wrap:wrap;gap:8px}
main{max-width:1000px;margin:0 auto;padding:16px;display:grid;gap:14px}
section{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px}
button,.btn{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 12px;border-radius:6px}
header button,header .btn{background:transparent;color:var(--pineink);border-color:rgba(255,255,255,.45)}
button:hover,.btn:hover{border-color:var(--pine)}
button:focus-visible,select:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--sun);outline-offset:2px}
button.main{background:var(--pine);color:var(--pineink);border-color:var(--pine);font-weight:600}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:620px){.g2{grid-template-columns:1fr}}
textarea{width:100%;height:120px;font:inherit;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);margin-top:4px}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button.on{background:var(--pine);color:var(--pineink);border-color:var(--pine)}
.clock{font:700 26px Georgia,serif;margin:0 0 4px}
.clock span{color:var(--pine)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.card{text-align:left;padding:10px 12px;border-left:5px solid var(--pine)}
.card b{display:block}.card small{color:var(--mut);display:block}
.card.grey{opacity:.5;border-left-color:var(--line)}
.card.grey small.why{color:var(--bad)}
.ov{display:inline-block;background:var(--sun);color:#2b1d00;border-radius:4px;padding:0 6px;font-size:12px;font-weight:700;margin-left:4px}
.cnt{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.cnt span{border:1px solid var(--line);border-radius:6px;padding:4px 10px;font-variant-numeric:tabular-nums}
.cnt span.now{background:var(--pine);color:var(--pineink);border-color:var(--pine)}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:13px;color:var(--mut);font-weight:600}
.chip{display:inline-block;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:1px 4px 1px 9px;margin:0 4px 4px 0}
.chip i{font-style:normal;cursor:pointer;color:var(--mut);padding:0 5px}
select{font:inherit;padding:2px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:4px;max-width:110px}
.x{border:0;background:none;color:var(--mut);padding:2px 6px}
.sk{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.sk span{flex:1;min-width:220px}.sk em{color:var(--bad);font-style:normal}
input[type=text],input[type=date]{font:inherit;padding:6px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
#msg{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;max-width:92vw;display:none;z-index:9}
.mut{color:var(--mut)}
</style></head><body>
<header><h1>Trip Draft</h1>
<div class="bar">
<label class="btn">Import Excel<input type="file" id="f" accept=".xlsx,.xls" hidden></label>
<button id="bx">Export Excel</button><button id="bi">Export calendar (.ics)</button>
<button id="bu">Undo</button><button id="br">Reset all</button></div></header>
<main>
<section><h2>People <small>one name per line, most senior first</small></h2>
<div class="g2"><label><b>Trip leaders</b><textarea id="tl"></textarea></label>
<label><b>Seconds</b><textarea id="ts"></textarea></label></div></section>
<section id="draft"></section>
<section id="cnt"></section>
<section id="tbl"></section>
<section id="skp"></section>
<section><h2>Add a trip by hand <small>for anything the import skipped or missed</small></h2>
<div class="row"><input type="date" id="md" aria-label="Start date"><input type="date" id="me" aria-label="End date (overnight)"><input type="text" id="mn" placeholder="Trip name" aria-label="Trip name"><input type="text" id="ml" placeholder="Location" aria-label="Location"><button id="ma" class="main">Add trip</button></div>
<small class="mut">Leave the end date empty for a single-day trip. An end date makes it an overnight that is picked as one trip.</small></section>
</main>
<div id="msg" role="status"></div>
<script>
//LOGIC
const K='tripdraft_v1',p2=n=>String(n).padStart(2,'0');
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ymd=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
const dt=s=>new Date(s+'T12:00:00');
const addDay=(s,n)=>{const d=dt(s);d.setDate(d.getDate()+n);return ymd(d)};
const fmt=s=>dt(s).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
const dn=t=>t.name.replace(/\s*day\s*(one|1)\b/i,'').replace(/\s*\?/g,'').replace(/\s+/g,' ').trim();
const stem=t=>(t.name+'|'+t.loc).toLowerCase().replace(/\(.*?\)|day\s*(one|two|1|2)|overnight|\?/g,'').replace(/[^a-z|]/g,'');
const SKIPRE=/ropes|training|open house|climbing wall|clinic|break/i;
function blank(){return{trips:[],skipped:[],leaders:[],seconds:[],phase:'leaders',turn:{leaders:0,seconds:0},hist:[],ov:false}}
function toIso(v,yr){
 if(v instanceof Date&&!isNaN(v))return ymd(new Date(v.getTime()+432e5));
 const m=String(v==null?'':v).match(/(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?/);if(!m)return null;
 const y=m[3]?(m[3].length==2?2000+ +m[3]:+m[3]):yr;if(+m[1]<1||+m[1]>12||+m[2]<1||+m[2]>31)return null;
 return y+'-'+p2(m[1])+'-'+p2(m[2]);
}
function mk(o,S){
 const base=o.start+'-'+stem(o).replace(/\|/g,'-').slice(0,24);let id=base,n=2;
 while(S.trips.some(t=>t.id==id))id=base+'-'+n++;
 return Object.assign({id,end:o.start,loc:'',veh:'',price:null,rows:[],leaders:[],seconds:[]},o,{id});
}
function parseRows(R){
 const H=(R[0]||[]).map(h=>String(h||'').toLowerCase()),ix=(k,d)=>{const i=H.findIndex(h=>h.includes(k));return i<0?d:i};
 const c={d:ix('date',0),n:ix('trip',1),l:ix('location',2),v:ix('vehicle',3),a:ix('assistant',6),p:ix('price',7),L:ix('leader',5)};
 const ys={};R.slice(1).forEach(r=>{if(r[c.d] instanceof Date){const y=r[c.d].getFullYear();ys[y]=(ys[y]||0)+1}});
 const yr=+Object.keys(ys).sort((a,b)=>ys[b]-ys[a])[0]||new Date().getFullYear();
 const S={trips:[]},sk=[],units=[];
 R.slice(1).forEach((r,i)=>{
  const name=String(r[c.n]||'').trim();if(!name)return;
  const loc=String(r[c.l]||'').trim(),veh=String(r[c.v]||'').trim(),iso=toIso(r[c.d],yr);
  const o={row:i+2,date:iso,name,loc,veh,price:typeof r[c.p]=='number'?r[c.p]:null};
  let why='';
  if(!iso)why='Could not read the date ("'+String(r[c.d]||'empty')+'")';
  else if(SKIPRE.test(name+' '+loc))why='Looks like an event or break, not a trip';
  else if(!loc&&!veh)why='No location or vehicle';
  else if(![0,6].includes(dt(iso).getDay()))why='Not on a weekend';
  if(why)sk.push(Object.assign(o,{reason:why}));else units.push(o);
 });
 units.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:a.row-b.row);
 const out=[];
 units.forEach(u=>{
  const t={start:u.date,end:u.date,name:u.name,loc:u.loc,veh:u.veh,price:u.price,rows:[u.row]},p=out[out.length-1];
  if(p&&p.start==p.end&&dt(p.end).getDay()==6&&addDay(p.end,1)==t.start&&stem(p)==stem(t)){p.end=t.end;p.rows.push(u.row)}
  else out.push(t);
 });
 out.forEach(t=>S.trips.push(mk(t,S)));
 return{trips:S.trips,skipped:sk,cols:c};
}
function status(S,t,p){
 const ph=S.phase,slot=t[ph],other=ph=='leaders'?t.seconds:t.leaders;
 if(slot.includes(p))return 'Already on this trip';
 if(other.includes(p))return 'Already on this trip as '+(ph=='leaders'?'second':'leader');
 if(S.trips.some(o=>o!==t&&o.leaders.concat(o.seconds).includes(p)&&o.start<=t.end&&t.start<=o.end))return 'Has another trip those dates';
 if(slot.length)return 'Already has a '+(ph=='leaders'?'leader':'second');
 return '';
}
//ENDLOGIC
let S=(()=>{try{return Object.assign(blank(),JSON.parse(localStorage[K]))}catch(e){return blank()}})(),WB=null,COLS=null;
const $=s=>document.querySelector(s),save=()=>{try{localStorage[K]=JSON.stringify(S)}catch(e){}};
const who=()=>{const l=S[S.phase];return l.length?l[S.turn[S.phase]%l.length]:null};
const adv=()=>{S.turn[S.phase]++};
const snap=()=>{S.hist.push(JSON.stringify({trips:S.trips,turn:S.turn,phase:S.phase}));if(S.hist.length>150)S.hist.shift()};
function toast(h){const m=$('#msg');m.innerHTML=h;m.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>m.style.display='none',6000)}
const names=v=>v.split('\n').map(s=>s.trim()).filter(Boolean);
const ovn=t=>t.end>t.start?'<span class="ov">overnight</span>':'';
const when=t=>fmt(t.start)+(t.end>t.start?' to '+fmt(t.end):'');
function render(){
 const ph=S.phase,p=who(),open=S.trips.filter(t=>!t[ph].length).length,word=ph=='leaders'?'leader':'second';
 let h='<div class="tabs"><button data-a="ph" data-v="leaders" class="'+(ph=='leaders'?'on':'')+'">Leaders round</button><button data-a="ph" data-v="seconds" class="'+(ph=='seconds'?'on':'')+'">Seconds round</button></div>';
 if(!S.trips.length)h+='<p>No trips yet. Import your Excel file or add a trip by hand.</p>';
 else if(!p)h+='<p>Add names to the '+(ph=='leaders'?'trip leaders':'seconds')+' list above to start this round.</p>';
 else{
  h+='<p class="clock"><span>'+esc(p)+'</span>, pick a '+word+' spot</p><div class="row"><button data-a="rand" class="main">Random pick</button><button data-a="skip">Skip '+esc(p)+'</button><label><input type="checkbox" id="ov"'+(S.ov?' checked':'')+'> Show unavailable trips (override)</label></div>';
  const list=S.trips.map(t=>({t,why:status(S,t,p)})).filter(x=>S.ov||!x.why);
  if(!open)h+='<p>Every trip has a '+word+'. Switch rounds when you are ready.</p>';
  else if(!list.length)h+='<p>Nothing is open for '+esc(p)+'. Skip to the next person.</p>';
  h+='<div class="cards">'+list.map(x=>'<button class="card'+(x.why?' grey':'')+'" data-a="pick" data-id="'+x.t.id+'"><b>'+esc(dn(x.t))+ovn(x.t)+'</b><small>'+when(x.t)+(x.t.loc?' · '+esc(x.t.loc):'')+'</small>'+(x.why?'<small class="why">'+x.why+'</small>':'')+'</button>').join('')+'</div>';
 }
 $('#draft').innerHTML='<h2>Draft</h2>'+h;
 const cn=role=>S[role].map(n=>{const a=S.trips.filter(t=>t[role].includes(n));return '<span class="'+(role==ph&&n==p?'now':'')+'">'+esc(n)+': '+a.length+'('+a.filter(t=>t.end>t.start).length+')</span>'}).join('')||'<span class="mut">No names yet</span>';
 const un=r=>S.trips.filter(t=>!t[r].length).length;
 $('#cnt').innerHTML='<h2>Trip counts <small>total (overnights)</small></h2><b>Leaders</b><div class="cnt">'+cn('leaders')+'</div><b>Seconds</b><div class="cnt">'+cn('seconds')+'</div><small class="mut">'+un('leaders')+' trips still need a leader, '+un('seconds')+' still need a second.</small>';
 const chips=(t,r)=>t[r].map((n,k)=>'<span class="chip">'+esc(n)+'<i data-a="rm" data-id="'+t.id+'" data-r="'+r+'" data-k="'+k+'" title="Remove" role="button">×</i></span>').join('')+
  '<select data-a="add" data-id="'+t.id+'" data-r="'+r+'" aria-label="Add '+r+'"><option value="">+ add</option>'+S[r].map(n=>'<option>'+esc(n)+'</option>').join('')+'</select>';
 $('#tbl').innerHTML='<h2>All trips <small>'+S.trips.length+' in the draft. Change any assignment by hand here.</small></h2>'+(S.trips.length?'<div style="overflow-x:auto"><table><tr><th>Date</th><th>Trip</th><th>Leader(s)</th><th>Second(s)</th><th></th></tr>'+S.trips.map(t=>'<tr><td>'+when(t)+'</td><td>'+esc(dn(t))+ovn(t)+'<br><small class="mut">'+esc(t.loc)+'</small></td><td>'+chips(t,'leaders')+'</td><td>'+chips(t,'seconds')+'</td><td><button class="x" data-a="del" data-id="'+t.id+'" title="Remove trip from draft" aria-label="Remove trip">×</button></td></tr>').join('')+'</table></div>':'<p class="mut">Nothing here yet.</p>');
 $('#skp').innerHTML=S.skipped.length?'<h2>Skipped from the import <small>'+S.skipped.length+' rows. Add any back if they should be drafted.</small></h2>'+S.skipped.map((s,k)=>'<div class="sk"><span><b>'+esc(s.name)+'</b> <small class="mut">row '+s.row+(s.date?' · '+fmt(s.date):'')+'</small><br><em>'+esc(s.reason)+'</em></span><button data-a="sk" data-k="'+k+'">Add to draft</button></div>').join(''):'';
 save();
}
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-a]');if(!b||b.tagName=='SELECT')return;
 const a=b.dataset.a,t=S.trips.find(x=>x.id==b.dataset.id),p=who();
 if(a=='ph')S.phase=b.dataset.v;
 else if(a=='pick'&&t&&p){snap();t[S.phase].push(p);adv()}
 else if(a=='skip'&&p){snap();adv()}
 else if(a=='rand'&&p){
  const av=S.trips.filter(x=>!status(S,x,p));
  if(!av.length)return toast('Nothing is open for '+esc(p)+'. Use Skip.');
  const x=av[Math.random()*av.length|0];snap();x[S.phase].push(p);adv();toast(esc(p)+' got '+esc(dn(x)));
 }
 else if(a=='rm'&&t){snap();t[b.dataset.r].splice(+b.dataset.k,1)}
 else if(a=='del'&&t){snap();S.trips=S.trips.filter(x=>x!==t)}
 else if(a=='sk'){
  const s=S.skipped[+b.dataset.k];let d=s.date||prompt('Date for "'+s.name+'" (YYYY-MM-DD):');
  if(!d||!/^\d{4}-\d\d-\d\d$/.test(d))return toast('That date was not valid. Use YYYY-MM-DD.');
  snap();S.trips.push(mk({start:d,name:s.name,loc:s.loc,veh:s.veh,price:s.price,rows:[s.row]},S));
  S.trips.sort((x,y)=>x.start<y.start?-1:1);S.skipped.splice(+b.dataset.k,1);
 }
 render();
});
document.addEventListener('change',e=>{
 const s=e.target;
 if(s.dataset.a=='add'&&s.value){const t=S.trips.find(x=>x.id==s.dataset.id);snap();t[s.dataset.r].push(s.value);render()}
 else if(s.id=='ov'){S.ov=s.checked;render()}
});
$('#tl').oninput=e=>{S.leaders=names(e.target.value);render()};
$('#ts').oninput=e=>{S.seconds=names(e.target.value);render()};
$('#bu').onclick=()=>{
 if(!S.hist.length)return toast('Nothing to undo.');
 Object.assign(S,JSON.parse(S.hist.pop()));render();toast('Undid the last action.');
};
$('#br').onclick=()=>{
 if(!confirm('Clear the people, trips, and all picks?'))return;
 S=blank();WB=null;$('#tl').value='';$('#ts').value='';render();
};
$('#ma').onclick=()=>{
 const d=$('#md').value,n=$('#mn').value.trim();if(!d||!n)return toast('Enter a date and a trip name.');
 const e=$('#me').value;snap();
 S.trips.push(mk({start:d,end:e&&e>d?e:d,name:n,loc:$('#ml').value.trim()},S));
 S.trips.sort((x,y)=>x.start<y.start?-1:1);$('#mn').value='';$('#ml').value='';render();
};
$('#f').onchange=async e=>{
 const f=e.target.files[0];if(!f)return;
 if(S.trips.some(t=>t.leaders.length||t.seconds.length)&&!confirm('Importing replaces the current trips and picks. Continue?')){e.target.value='';return}
 try{
  WB=XLSX.read(await f.arrayBuffer(),{type:'array',cellDates:true});
  const R=XLSX.utils.sheet_to_json(WB.Sheets[WB.SheetNames[0]],{header:1,raw:true,defval:null});
  const r=parseRows(R);COLS=r.cols;S.trips=r.trips;S.skipped=r.skipped;S.hist=[];S.turn={leaders:0,seconds:0};
  render();toast('Imported '+r.trips.length+' trips ('+r.trips.filter(t=>t.end>t.start).length+' overnight). '+r.skipped.length+' rows were skipped, see the list below.');
 }catch(err){toast('Could not read that file. Check that it is an .xlsx with the same columns as before.')}
 e.target.value='';
};
function dl(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
$('#bx').onclick=()=>{
 let wb=WB,ws;const c=COLS||{L:5,a:6};
 if(wb)ws=wb.Sheets[wb.SheetNames[0]];
 else{ws=XLSX.utils.aoa_to_sheet([['Date','Trip','Location','Vehicle #','Lynchburg / Enterprise','Trip Leader','Assistant Staff','Trip Price']]);wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Sheet1')}
 const rg=XLSX.utils.decode_range(ws['!ref']);let next=rg.e.r+1;
 const put=(r,col,v)=>{if(v!=='')ws[XLSX.utils.encode_cell({r,c:col})]={t:'s',v}};
 S.trips.forEach(t=>{
  const L=t.leaders.join(', '),A=t.seconds.join(', ');
  if(t.rows.length)t.rows.forEach(r=>{put(r-1,c.L,L);put(r-1,c.a,A)});
  else{const r=next++;put(r,0,when(t));put(r,1,t.name);put(r,2,t.loc);put(r,c.L,L);put(r,c.a,A)}
 });
 rg.e.r=Math.max(rg.e.r,next-1);ws['!ref']=XLSX.utils.encode_range(rg);
 XLSX.writeFile(wb,'trip_assignments.xlsx');
};
$('#bi').onclick=()=>{
 const trips=S.trips.filter(t=>t.leaders.length||t.seconds.length);
 if(!trips.length)return toast('No trips have been assigned yet.');
 const e=s=>String(s).replace(/[\\;,]/g,'\\$&').replace(/\n/g,'\\n'),d=s=>s.replace(/-/g,''),stamp=new Date().toISOString().replace(/[-:]|\.\d+/g,'');
 const o=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Trip Draft//EN','CALSCALE:GREGORIAN'];
 trips.forEach(t=>{
  const desc=['Leader: '+(t.leaders.join(', ')||'TBD'),'Second: '+(t.seconds.join(', ')||'TBD')];
  if(t.loc)desc.push('Location: '+t.loc);if(t.veh)desc.push('Vehicle: '+t.veh);
  o.push('BEGIN:VEVENT','UID:'+t.id+'@tripdraft','DTSTAMP:'+stamp,'DTSTART;VALUE=DATE:'+d(t.start),'DTEND;VALUE=DATE:'+d(addDay(t.end,1)),
   'SUMMARY:'+e(dn(t)+' ('+(t.leaders.join(', ')||'TBD')+' / '+(t.seconds.join(', ')||'TBD')+')'),'DESCRIPTION:'+e(desc.join('\n')));
  if(t.loc)o.push('LOCATION:'+e(t.loc));o.push('END:VEVENT');
 });
 o.push('END:VCALENDAR');
 dl(new Blob([o.join('\r\n')],{type:'text/calendar'}),'trips.ics');
};
$('#tl').value=S.leaders.join('\n');$('#ts').value=S.seconds.join('\n');render();
</script></body></html>
